<style>
        /* Custom Keyframes for Animations */
        @keyframes pulse-bolt {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(218, 46, 85, 0.4)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 30px rgba(218, 46, 85, 0.8)); }
        }
        
        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        @keyframes slide-up-spring {
            0% { transform: translateY(50px); opacity: 0; }
            60% { transform: translateY(-10px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes ambient-glow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Utility Classes mapping to animations */
        .animate-bolt {
            animation: pulse-bolt 1.5s ease-in-out infinite;
        }

        .animate-ripple {
            animation: ripple 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            border: 2px solid rgba(218, 46, 85, 0.3);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            margin-top: -50px;
            margin-left: -50px;
        }
        
        .animate-ripple-delay-1 {
            animation-delay: 0.5s;
        }
        
        .animate-ripple-delay-2 {
            animation-delay: 1s;
        }

        .animate-slide-up {
            animation: slide-up-spring 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0; /* Starts hidden until animation kicks in */
            animation-delay: 0.5s;
        }

        .bg-ambient {
            background: radial-gradient(circle at 50% 50%, rgba(33, 49, 69, 1) 0%, rgba(11, 28, 48, 1) 100%);
            background-size: 200% 200%;
            animation: ambient-glow 10s ease infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-on-surface text-on-primary font-body-md h-screen w-full overflow-hidden flex flex-col items-center justify-center relative">
<!-- Ambient Animated Background -->
<div class="absolute inset-0 bg-ambient z-0"></div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col items-center justify-center w-full max-w-md mx-auto h-full px-margin-mobile">
<!-- Central Icon/Logo Area with Ripples -->
<div class="relative flex items-center justify-center mb-xl w-32 h-32">
<!-- Ripples -->
<div class="animate-ripple"></div>
<div class="animate-ripple animate-ripple-delay-1"></div>
<div class="animate-ripple animate-ripple-delay-2"></div>
<!-- Lightning Bolt -->
<div class="animate-bolt text-primary-container z-20 flex items-center justify-center">
<span class="material-symbols-outlined text-[80px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
</div>
<!-- Typography / Tagline -->
<div class="animate-slide-up text-center mt-lg">
<h1 class="font-headline-xl text-headline-xl text-on-primary tracking-tight">Cupid</h1>
<p class="font-body-lg text-body-lg text-inverse-primary mt-sm tracking-wide opacity-90">find your vibe</p>
</div>
</div>
